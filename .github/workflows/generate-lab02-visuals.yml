name: Generate Module 4 Traffic Manager visual assets

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-lab02-visuals.yml'
      - 'modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/visual-learning/generate_visuals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate PNG diagrams
        run: python modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/visual-learning/generate_visuals.py

      - name: Commit generated diagrams
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/visual-learning/*.png
          if git diff --cached --quiet; then
            echo "No visual changes to commit."
          else
            git commit -m "Generate Traffic Manager visual assets"
            git push
          fi
