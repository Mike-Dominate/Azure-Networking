name: Generate Module 4 Traffic Manager PDF manual

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-lab02-pdf.yml'
      - 'modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/documentation/Lab02-Traffic-Manager-Rebuild-Practice-Manual.md'
      - 'modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/visual-learning/*.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc weasyprint

      - name: Build PDF
        shell: bash
        run: |
          cd modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/documentation
          cat > lab02-pdf.css <<'CSS'
          @page { size: A4; margin: 17mm 16mm 18mm 16mm; }
          body { font-family: Arial, sans-serif; font-size: 10pt; line-height: 1.35; color: #202020; }
          h1 { color: #17365d; font-size: 24pt; margin-bottom: 6pt; }
          h2 { color: #17365d; font-size: 17pt; border-bottom: 1px solid #d0d7de; padding-bottom: 3pt; }
          h3 { color: #2f5597; font-size: 12.5pt; }
          pre { background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px; padding: 8px; font-size: 8.5pt; white-space: pre-wrap; }
          code { font-family: 'DejaVu Sans Mono', monospace; }
          img { max-width: 100%; height: auto; page-break-inside: avoid; }
          blockquote { border-left: 4px solid #2f5597; margin-left: 0; padding-left: 10px; color: #404040; }
          table { border-collapse: collapse; width: 100%; }
          th, td { border: 1px solid #d0d7de; padding: 5px; vertical-align: top; }
          CSS
          pandoc Lab02-Traffic-Manager-Rebuild-Practice-Manual.md --standalone --css lab02-pdf.css --metadata title='Azure Traffic Manager - Rebuild and Practice Manual' -o Lab02-Traffic-Manager-Rebuild-Practice-Manual.html
          weasyprint Lab02-Traffic-Manager-Rebuild-Practice-Manual.html Lab02-Traffic-Manager-Rebuild-Practice-Manual.pdf
          rm -f Lab02-Traffic-Manager-Rebuild-Practice-Manual.html lab02-pdf.css

      - name: Commit PDF
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/04-load-balance-non-http-traffic-in-azure/06-exercise-create-a-traffic-manager-profile-using-the-azure-portal/practical/documentation/Lab02-Traffic-Manager-Rebuild-Practice-Manual.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Generate Traffic Manager PDF manual"
            git push
          fi
